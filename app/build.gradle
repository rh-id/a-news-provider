plugins {
    alias(libs.plugins.android.application)
}

apply from: "$rootDir/gradle/license-html-generator.gradle"

def keyStoreFile = File.createTempFile("key", null)
keyStoreFile.deleteOnExit()

if (System.getenv("SIGNING_KEY") != null) {
    println 'key exist'
    keyStoreFile.bytes = Base64.decoder.decode(System.getenv("SIGNING_KEY"))
} else {
    println 'key NOT exist'
}

android {
    compileSdk = 37

    signingConfigs {
        release {
            storeFile keyStoreFile
            storePassword System.getenv("KEY_STORE_PASSWORD")
            keyAlias System.getenv("ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    defaultConfig {
        applicationId "m.co.rh.id.a_news_provider"
        minSdkVersion 21
        targetSdk 37
        versionCode 76
        versionName "2.1.0"
        vectorDrawables.useSupportLibrary true

        testInstrumentationRunner "m.co.rh.id.a_news_provider.test.AppAndroidJunit4Runner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("SIGNING_KEY") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding false
        buildConfig true
    }
    namespace 'm.co.rh.id.a_news_provider'
    lint {
        abortOnError = true
        warningsAsErrors = false
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs

    implementation project(path: ':base')
    implementation project(path: ':component-network')

    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.leakcanary.plumber
    implementation libs.android.showcase
    implementation libs.work.runtime

    testImplementation libs.junit
    testImplementation libs.mockito.core
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core
    // for in-memory Room in androidTest (RssRepositoryTest); base exposes room-runtime
    // only as `implementation`, so it does not leak into this module's test classpath
    androidTestImplementation libs.room.runtime
}

project.afterEvaluate {
    def versionCode = android.defaultConfig.versionCode
    File changeLogTxt = new File(project.rootDir, "fastlane/metadata/android/en-US/changelogs/" + versionCode + ".txt")
    if (changeLogTxt.exists()) {
        File outputChangeLog = new File(project.buildDir, "changelog.txt")
        if (!outputChangeLog.exists()) {
            outputChangeLog.parentFile.mkdirs()
            outputChangeLog.createNewFile()
        }
        outputChangeLog.bytes = changeLogTxt.bytes
    }
}